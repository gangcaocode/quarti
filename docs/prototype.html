<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quarti prototype</title>
<style>
:root{
  --br:#0F6E56;--brl:#E1F5EE;--brd:#085041;
  --am:#BA7517;--aml:#FAEEDA;--amd:#633806;
  --co:#D85A30;--col:#FAECE7;--cod:#712B13;
  --bl:#185FA5;--bll:#E6F1FB;--bld:#0C447C;
  --rd:#A32D2D;--rdl:#FCEBEB;--rdd:#791F1F;
  --pu:#534AB7;--pul:#EEEDFE;--pud:#26215C;
  --s0:#F1EFE8;--s1:#F8F7F3;--s2:#FFFFFF;
  --t1:#1A1A18;--t2:#5F5E5A;--t3:#9C9A92;
  --b:rgba(0,0,0,.1);--bs:rgba(0,0,0,.18);
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Helvetica Neue',sans-serif;background:#111110;min-height:100vh;display:flex;flex-direction:column}
.app-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:0.5px solid rgba(255,255,255,.1);flex-shrink:0}
.logo{font-size:16px;font-weight:500;color:#fff;letter-spacing:-.3px}.logo span{color:#5DCAA5}
.stabs{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px;border-bottom:0.5px solid rgba(255,255,255,.1);flex-shrink:0}
.stabs::-webkit-scrollbar{display:none}
.stab{padding:5px 13px;font-size:12px;font-weight:500;border-radius:20px;border:0.5px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.4);cursor:pointer;white-space:nowrap}
.stab.on{background:var(--br);color:#fff;border-color:var(--br)}
.stage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;flex-wrap:wrap}
.phone{width:320px;background:var(--s2);border-radius:36px;border:0.5px solid rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column;flex-shrink:0}
.plabel{font-size:10px;color:rgba(255,255,255,.3);text-align:center;margin-top:7px;letter-spacing:.04em}
.sbar{display:flex;justify-content:space-between;padding:12px 20px 4px;font-size:11px;font-weight:500;color:var(--t2)}
.nbar{display:flex;align-items:center;padding:7px 14px 9px;border-bottom:0.5px solid var(--b);gap:8px}
.ntitle{font-size:15px;font-weight:500;color:var(--t1);flex:1}
.nbk{font-size:13px;color:var(--br);cursor:pointer;background:none;border:none;padding:0;display:flex;align-items:center}
.nact{font-size:13px;color:var(--br);cursor:pointer;background:none;border:none;padding:0;font-weight:500}
.sa{padding:13px 15px;overflow-y:auto;max-height:560px}
.sa::-webkit-scrollbar{display:none}
.tbar{display:flex;border-top:0.5px solid var(--b);background:var(--s2)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:7px 0 9px;gap:3px;cursor:pointer;font-size:10px;color:var(--t3);border:none;background:none}
.tab.on{color:var(--br)}.tab i{font-size:19px}
.nbadge{min-width:16px;height:16px;border-radius:8px;color:#fff;font-size:10px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;padding:0 3px}
.slbl{font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin:13px 0 6px}
.slbl:first-child{margin-top:0}
.card{background:var(--s2);border:0.5px solid var(--b);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.flush{padding:0 14px}
.crow{display:flex;align-items:center;gap:9px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;flex-shrink:0}
.sq{border-radius:9px!important}
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.bg{background:var(--brl);color:var(--brd)}.ba{background:var(--aml);color:var(--amd)}
.bc{background:var(--col);color:var(--cod)}.bb{background:var(--bll);color:var(--bld)}
.br2{background:var(--rdl);color:var(--rdd)}.bgr{background:var(--s0);color:var(--t2)}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:12px;background:var(--s0);color:var(--t2);border:0.5px solid var(--b);margin:2px;cursor:pointer}
.chip.on{background:var(--brl);color:var(--brd);border-color:var(--br)}
.divl{height:0.5px;background:var(--b);margin:9px 0}
.btn{width:100%;padding:10px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:none;text-align:center;font-family:inherit}
.bpri{background:var(--br);color:#fff}.bsec{background:var(--s0);color:var(--t1);border:0.5px solid var(--bs)}
.bgh{background:transparent;color:var(--br);border:0.5px solid var(--br)}
.bdng{background:var(--rdl);color:var(--rdd);border:0.5px solid var(--co)}
.btn+.btn{margin-top:7px}
.strow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:9px}
.stc{background:var(--s0);border-radius:var(--r);padding:9px 11px}
.stv{font-size:20px;font-weight:500;color:var(--t1)}.stl{font-size:11px;color:var(--t3);margin-top:1px}
.inpf{width:100%;padding:9px 11px;border-radius:var(--r);border:0.5px solid var(--bs);background:var(--s0);font-size:14px;color:var(--t1);margin-bottom:8px;font-family:inherit;outline:none}
.inpl{font-size:12px;color:var(--t2);margin-bottom:3px}
.stars-row{display:flex;gap:1px;align-items:center}
.st{color:var(--am);font-size:12px}.ste{color:var(--b);font-size:12px}
.wrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:0.5px solid var(--b)}
.wrow:last-child{border-bottom:none}
.hitem{display:flex;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--b)}
.hitem:last-child{border-bottom:none}
.msg-bubble{padding:8px 11px;border-radius:10px;font-size:13px;max-width:80%;margin-bottom:6px;line-height:1.5}
.msg-in{background:var(--s0);color:var(--t1)}.msg-out{background:var(--br);color:#fff}
.tl-section{margin-bottom:14px}
.tl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.tl-name{font-size:12px;font-weight:500;color:var(--t1);display:flex;align-items:center;gap:6px}
.tl-axis{display:flex;justify-content:space-between;margin-bottom:3px;padding:0 1px}
.tl-axis span{font-size:9px;color:var(--t3)}
.tl-track{position:relative;height:26px;background:var(--s0);border-radius:5px;margin-bottom:4px}
.tl-bar{position:absolute;top:3px;height:20px;border-radius:4px;display:flex;align-items:center;padding:0 6px;font-size:10px;font-weight:500;white-space:nowrap;overflow:hidden;cursor:pointer}
.tl-empty{position:absolute;top:3px;height:20px;border-radius:4px;border:1px dashed var(--co);background:var(--rdl);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tl-offer{position:absolute;top:3px;height:20px;border-radius:4px;background:var(--aml);border:0.5px solid #FAC775;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:2px 5px;cursor:pointer}
.clr-m{background:var(--brl);color:var(--brd);border:0.5px solid #9FE1CB}
.clr-l{background:var(--aml);color:var(--amd);border:0.5px solid #FAC775}
.clr-d{background:var(--bll);color:var(--bld);border:0.5px solid #B5D4F4}
.tl-offer{overflow:visible}
.tl-mbadge{position:absolute;top:-7px;right:-5px;min-width:18px;height:16px;padding:0 4px;border-radius:8px;background:var(--am);color:#fff;font-size:9px;font-weight:500;display:flex;align-items:center;gap:2px;border:1.5px solid var(--s2);z-index:2}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-dow{font-size:10px;color:var(--t3);text-align:center;padding:2px 0 4px;font-weight:500}
.cal-day{height:38px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--t1);cursor:pointer;border:1px solid transparent;background:var(--s1)}
.cal-day.past{color:var(--t3);background:transparent}
.cal-day.today{border-color:var(--br);color:var(--br)}
.cal-day.sel{background:var(--br);color:#fff;border-color:var(--br)}
.cal-dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.cal-per{border-left:3px solid;border-radius:0 10px 10px 0;background:var(--s1);padding:9px 11px;margin-bottom:9px}
.cal-wchip{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 9px;border-radius:20px;font-size:11px;font-weight:500;background:var(--brl);color:var(--brd);margin:2px}
.cal-wchip button{width:16px;height:16px;border-radius:50%;border:none;background:rgba(0,0,0,.08);color:var(--brd);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;padding:0}
.cal-add{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;border:1px dashed var(--co);background:var(--rdl);color:var(--rdd);cursor:pointer;margin:2px}
.mini-btn{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:0.5px solid var(--bs);background:var(--s0);color:var(--t2);font-family:inherit;display:inline-flex;align-items:center;gap:4px}
.stp{display:flex;align-items:center;border:0.5px solid var(--bs);border-radius:var(--r);overflow:hidden;background:var(--s2);width:fit-content}
.stp button{width:30px;height:30px;border:none;background:var(--s0);font-size:15px;cursor:pointer;color:var(--t1)}
.phone{position:relative}
.sheet-bg{position:fixed;inset:0;background:rgba(26,26,24,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--s2);width:min(320px,100vw);border-radius:18px 18px 0 0;padding:18px 16px 22px;max-height:85vh;overflow-y:auto;box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(292px,calc(100vw - 28px));box-shadow:0 6px 18px rgba(0,0,0,.25);background:var(--t1);color:#fff;font-size:12px;line-height:1.45;padding:9px 12px;border-radius:10px;z-index:30}
.tl-addx{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--br);background:none;border:none;cursor:pointer;padding:3px 0 0;font-family:inherit}
div[style*="display:flex"] > .btn + .btn, div[style*="display:grid"] > .btn + .btn{margin-top:0}
.plink{cursor:pointer;text-decoration:underline;text-decoration-color:rgba(0,0,0,.22);text-underline-offset:3px}
.plink:hover{text-decoration-color:currentColor}
.msg-time{font-size:10px;color:var(--t3);margin-bottom:8px}
.tl-blank{border:1px dashed var(--co);background:var(--rdl);cursor:copy}
.tl-blank-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:500;color:var(--rdd);pointer-events:none}
.tl-blank-x{position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;border:none;background:rgba(0,0,0,.08);color:var(--rdd);cursor:pointer;font-size:12px;line-height:1;padding:0}
.ti{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;line-height:1;font-style:normal;flex-shrink:0;vertical-align:-0.14em}
.ti svg{width:1em;height:1em;display:block}
.cal-nav{display:inline-flex;align-items:center;gap:2px;padding:6px 11px 6px 8px;border-radius:20px;border:0.5px solid var(--bs);background:var(--s2);font-size:12px;font-weight:500;color:var(--br);cursor:pointer;font-family:inherit}
.cal-nav.next{padding:6px 8px 6px 11px}
.cal-title{display:inline-flex;align-items:center;gap:4px;font-size:15px;font-weight:500;color:var(--t1);background:none;border:none;cursor:pointer;font-family:inherit;padding:4px 6px;border-radius:8px}
.cal-title:hover{background:var(--s1)}
.tl-track.addable{cursor:copy}
.tl-track.addable:hover{box-shadow:inset 0 0 0 1px var(--bs)}
.tl-hint{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t3);margin:-4px 0 12px}
.bpu{background:var(--pul);color:var(--pud)}
.vbadge{border:none;cursor:pointer;font-family:inherit;flex-shrink:0}
.linkbtn{font-size:11px;color:var(--br);background:none;border:none;cursor:pointer;font-family:inherit;padding:0;font-weight:500}
.proto-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 9px 4px 4px;border-radius:20px;border:1px dashed var(--pu);background:var(--pul);color:var(--pud);font-size:11px;font-weight:500;cursor:pointer;font-family:inherit}
.ptag{background:var(--pu);color:#fff;border-radius:10px;padding:1px 6px;font-size:9px;letter-spacing:.03em;text-transform:uppercase}
.proto-banner{display:flex;gap:8px;align-items:flex-start;background:var(--pul);color:var(--pud);border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.5;margin-bottom:12px}
.mopt{flex:1;border-radius:10px;padding:10px;cursor:pointer;border:0.5px solid var(--bs);background:var(--s2);text-align:left;font-family:inherit}
.mopt.on{border:1px solid var(--br);background:var(--brl)}
.seg{display:flex;background:var(--s0);border-radius:10px;padding:3px;gap:3px}
.seg-b{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border:none;border-radius:8px;background:transparent;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;font-family:inherit}
.seg-b.on{background:var(--s2);color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.1);cursor:default}
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tl-bar.carry{opacity:.75;border-left:2px dashed var(--bs)}
.tl-bar.noshow{background:var(--rdl);color:var(--rdd);border:1px solid var(--co)}
.tl-bar.pend{background:var(--s2);color:var(--amd);border:1px dashed var(--am)}
.tl-bar.draft{background:var(--s1);color:var(--t2);border:1px dotted var(--bs);opacity:.85}
.clr-old{background:var(--s0);color:var(--t2);border:0.5px solid var(--bs)}
.tl-bar.sel,.tl-empty.sel{box-shadow:0 0 0 2px var(--br)}
.stamp{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:400;color:var(--t3);background:var(--s0);border:0.5px dashed var(--bs);border-radius:10px;padding:1px 6px;margin-left:5px;white-space:nowrap}
.stp div{min-width:48px;height:30px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;border-left:0.5px solid var(--b);border-right:0.5px solid var(--b)}
.lp-wrap{background:var(--s1);border:0.5px solid var(--b);border-radius:10px;padding:5px 4px 4px;margin-bottom:6px}
.lp-grid{border-collapse:separate;border-spacing:0;table-layout:fixed;width:100%;font-size:10px}
.lp-grid th{font-weight:400;color:var(--t3);font-size:9px;line-height:1.15;padding:0 0 3px;text-align:center}
.lp-grid th.lp-today{color:var(--br);font-weight:600}
.lp-grid th.lp-bo{color:var(--rd);text-decoration:underline}
.lp-grid td{height:15px;padding:0;text-align:center;border-bottom:0.5px solid var(--b);border-left:0.5px solid rgba(0,0,0,.04)}
.lp-grid .lp-nm{width:58px;text-align:left;padding-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;color:var(--t1);border-left:none}
.lp-grid .lp-off{color:var(--t3);font-style:italic}
.lp-grid .lp-lbl{color:var(--t3);font-size:9px;text-transform:uppercase;letter-spacing:.04em}
.lp-grid tr.lp-ph td{font-size:10px;font-weight:600;color:var(--t2);text-align:left;padding:5px 2px 1px;border-bottom:none;height:auto;border-left:none}
.lp-grid td.lp-bo{background:repeating-linear-gradient(135deg,transparent,transparent 3px,rgba(163,45,45,.10) 3px,rgba(163,45,45,.10) 5px)}
.lp-grid td.lp-ap{background:var(--br);cursor:pointer}
.lp-grid td.lp-rq{background:repeating-linear-gradient(135deg,var(--aml),var(--aml) 2px,var(--am) 2px,var(--am) 4px);cursor:pointer}
.lp-grid td.lp-sel{box-shadow:inset 0 0 0 1.5px var(--t1)}
.lp-grid td.lp-left{font-size:9.5px;font-weight:600;color:var(--t2);cursor:pointer;border-bottom:0.5px solid var(--bs)}
.lp-grid td.lp-short{background:var(--rdl);color:var(--rd)}
.lp-grid td.lp-cut{background:var(--rd);color:#fff}
.lp-legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10px;color:var(--t2);margin:2px 0 4px}
.lp-legend span{display:inline-flex;align-items:center;gap:4px}
.lp-sw{display:inline-block;width:11px;height:9px;border-radius:2px;border:0.5px solid var(--b)}
i.lp-sw.lp-ap{background:var(--br)} i.lp-sw.lp-rq{background:repeating-linear-gradient(135deg,var(--aml),var(--aml) 2px,var(--am) 2px,var(--am) 4px)} i.lp-sw.lp-short{background:var(--rdl)} i.lp-sw.lp-bo{background:repeating-linear-gradient(135deg,var(--s2),var(--s2) 2px,rgba(163,45,45,.35) 2px,rgba(163,45,45,.35) 3px)}
.lp-nav{width:30px;height:28px;border-radius:8px;border:0.5px solid var(--bs);background:var(--s2);color:var(--t1);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}
.lp-nav:disabled{opacity:.35;cursor:default}
.lp-bulk{display:flex;align-items:center;gap:10px;background:var(--brl);border:0.5px solid var(--br);border-radius:10px;padding:9px 11px;margin-bottom:6px}
.lp-line{display:flex;gap:6px;align-items:flex-start;font-size:12px;line-height:1.45;border-radius:7px;padding:5px 8px;text-align:left}
.lp-line i{font-size:13px;margin-top:2px;flex-shrink:0}
.lp-line.lp-red{background:var(--rdl);color:var(--rdd)}
.lp-line.lp-amber{background:var(--aml);color:var(--amd)}
.lp-line.lp-info,.lp-line.lp-ok{background:var(--s1);color:var(--t2)}
.lp-card{padding:10px 12px}
.lp-card.lp-c-red{border-color:var(--co)}
.lp-card.lp-c-amber{border-color:var(--am)}
.lp-card-sel{box-shadow:0 0 0 2px var(--t1)}
.lp-mini{padding:6px 9px;font-size:11px;color:var(--br)}
.bdg.lp-bred{background:var(--rdl);color:var(--rdd)}
.lp-chip{width:44px;padding:5px 0 4px;border-radius:9px;border:1px solid var(--bs);background:var(--s2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--t2);font-family:inherit;font-size:13px;position:relative}
.lp-chip b{font-weight:500;color:var(--t1)}
.lp-chip i{position:absolute;top:2px;right:3px;font-size:10px}
.lp-chip.lp-chip-red{border-color:var(--co)} .lp-chip.lp-chip-red i{color:var(--rd)}
.lp-chip.lp-chip-amber{border-color:var(--am)} .lp-chip.lp-chip-amber i{color:var(--am)}
.lp-chip.on{background:var(--br);border-color:var(--br);color:#fff}
.lp-chip.on b,.lp-chip.on i{color:#fff}
.lp-chip.lp-chip-past{opacity:.55}
.lr-step{display:flex;align-items:center;gap:2px;flex-shrink:0}
.lr-step button{width:28px;height:28px;border-radius:8px;border:0.5px solid var(--bs);background:var(--s2);font-size:16px;cursor:pointer;color:var(--t1)}
.lr-step button:disabled{opacity:.35;cursor:default}
.lr-step span{min-width:70px;text-align:center;font-size:12px;font-weight:500;color:var(--t1)}
.cal-day{height:50px;justify-content:flex-start;padding-top:4px;gap:1px;position:relative;overflow:hidden}
.cal-day .cal-num{font-size:12px;line-height:14px}
.cal-day .cal-hol{font-size:7.5px;line-height:9px;height:9px;color:var(--rd);font-weight:600;white-space:nowrap;overflow:hidden;max-width:100%;letter-spacing:.01em}
.cal-day.hol-busy .cal-hol{color:var(--pu)}
.cal-day .cal-hol.cal-bo{color:var(--t3);font-weight:500}
.cal-day.we{background:#EAF0FA}
.cal-day.past.we{background:rgba(24,95,165,.05)}
.cal-day.hol-stat .cal-num{color:var(--rd)}
.cal-day.sel{background:var(--s1);color:var(--t1);border:2px solid var(--t1);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.cal-day.sel.we{background:#EAF0FA}
.cal-day.sel.past{background:transparent}
.cal-day.sel .cal-num{font-size:15px;font-weight:700;line-height:15px}

function hydrateIcons(root) {
  (root || document).querySelectorAll('i.ti:not([data-i])').forEach(el => {
    el.setAttribute('data-i', '1');
    const cls = [...el.classList].find(x => x.startsWith('ti-') && ICONS[x.slice(3)]);
    if (!cls) return;
    const v = ICONS[cls.slice(3)], filled = v[0] === 'F';
    el.innerHTML = '<svg viewBox="0 0 24 24" ' + (filled ? 'fill="currentColor" stroke="none"' : 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"') + ' aria-hidden="true" focusable="false">' + v.slice(1) + '</svg>';
  });
}

function fsCalcDur() {
  const s = document.getElementById('fs-s'), e = document.getElementById('fs-e');
  if (!s || !e) return;
  if (!s.value || !e.value) { const d0 = document.getElementById('fs-dur'); if (d0) d0.textContent = '--'; return; }
  const [sh,sm] = s.value.split(':').map(Number), [eh,em] = e.value.split(':').map(Number);
  const m = (eh*60+em)-(sh*60+sm);
  const el = document.getElementById('fs-dur');
  if (!el) return;
  const next = m < 0, mm = next ? m + 1440 : m;
  if (mm === 0) { el.textContent = '--'; return; }
  el.textContent = Math.floor(mm/60)+'h'+(mm%60 ? ' '+mm%60+'m' : '') + (next ? ' · ends next day' : '');
}
function fsFilter(g) {
  fsCurFilter = g;
  ['all','baristas','dinner'].forEach(id => {
    const b = document.getElementById('fg-'+id); if (!b) return;
    const on = id === g;
    b.style.borderColor = on ? 'var(--br)' : 'var(--bs)';
    b.style.background  = on ? 'var(--brl)' : 'var(--s0)';
    b.style.color       = on ? 'var(--brd)' : 'var(--t2)';
  });
  fsRenderSrc();
}
function fsBump(diff) {
  if (diff > 0) return `<span style="padding:2px 6px;border-radius:20px;font-size:10px;font-weight:500;background:var(--brl);color:var(--brd)">+$${diff}/hr</span>`;
  if (diff < 0) return `<span style="padding:2px 6px;border-radius:20px;font-size:10px;font-weight:500;background:var(--rdl);color:var(--rdd)">-$${Math.abs(diff)}/hr</span>`;
  return `<span style="padding:2px 6px;border-radius:20px;font-size:10px;font-weight:500;background:var(--s0);color:var(--t3);border:0.5px solid var(--b)">normal</span>`;
}

function fsToggle(id) {

}

function fsChg(id, d) {

  shiftlink:{label:'Worked on Quarti',   cls:'bg',  icon:'ti-rosette-discount-check'},
  employer: {label:'Confirmed by employer', cls:'bb',  icon:'ti-building-store'},
  document: {label:'Document checked',      cls:'bpu', icon:'ti-file-certificate'},
  self:     {label:'Self-reported',         cls:'bgr', icon:'ti-user'},
  failed:   {label:'Not confirmed',         cls:'br2', icon:'ti-alert-triangle'},
};
const LEVEL_TEXT = {
  shiftlink:'Shifts done through Quarti: scheduled, confirmed by the worker and completed by the shop. The strongest proof, and it cannot be faked.',
  employer:'A manager at that business confirmed it, from the business email or the phone number listed for that business.',
  document:'Quarti checked a pay stub, T4 / Relevé 1 slip or employment letter against the employer name and years. The file is deleted after review.',
  self:'Entered by the worker. Nobody has confirmed it yet.',
  failed:"The employer said they don't recognize this person. It may still be true (managers change), but treat it with care.",
};
const EXP_SEED = {
  'sl|0':{level:'employer', how:"The store's owner-operator confirmed it from the franchise's business email on Aug 30, 2026."},
  'sl|1':{level:'document', how:'Relevé 1 slips for 2018 and 2019 checked by Quarti on Aug 29, 2026. The files were deleted after review.'},
  'tn|0':{level:'employer', how:'The store manager confirmed it from the business email on Jun 2, 2026.'},
  'rl|0':{level:'employer', how:'The kitchen manager confirmed it from the restaurant\'s listed phone on Mar 3, 2026.'},
  'kb|0':{level:'employer', how:'The restaurant owner confirmed it from the business email on Jan 18, 2026.'},
  'pd|0':{level:'document', how:'An employment letter was checked by Quarti on Apr 6, 2026. The file was deleted after review.'},
  'lg|0':{level:'employer', how:"The store's owner-operator confirmed it from the franchise's business email on Sep 12, 2026."},
};
const BIZ = {
  'La Banquise':{area:'Plateau-Mont-Royal, Montréal'},
  "McDonald's":{area:'Montréal', franchise:true},
  'Tim Hortons':{area:'Montréal', franchise:true},
};
let EXPS = {};
let profFlash = '';
let vx = null, el = null;

function exps(id) {
  if (!EXPS[id]) {
    const p = person(id);
    EXPS[id] = (p ? p.exp : []).map((e, i) => Object.assign({role:e[0], when:e[1], level:'self', how:'', req:null}, EXP_SEED[id + '|' + i] || {}));
  }
  return EXPS[id];
}
function bizOf(e) {
  const name = (e.role.split(' · ')[1] || 'the employer').trim();
  const b = BIZ[name] || {area:'Montréal'};
  return {name, area:b.area, franchise:!!b.franchise, domain:name.toLowerCase().replace(/[^a-z0-9]/g, '') + '.com'};
}
function yearsOf(e) { const m = e.when.match(/(\d{4})\s*[–-]\s*(\d{4})/); return m ? [Number(m[1]), Number(m[2])] : [2020, 2022]; }
function firstOf(id) { const p = person(id); return p ? p.name.split(' ')[0] : 'the worker'; }
function proto(js, label) { return `<button class="proto-btn" onclick="${js}"><span class="ptag">Prototype</span>${label}</button>`; }
function profFlashHtml() {
  if (!profFlash) return '';
  const m = profFlash; profFlash = '';
  return `<div style="background:var(--brl);color:var(--brd);border-radius:9px;padding:9px 12px;margin-bottom:12px;font-size:12px;line-height:1.5;display:flex;gap:7px"><i class="ti ti-circle-check" style="font-size:16px;flex-shrink:0" aria-hidden="true"></i><span>${m}</span></div>`;
}

// ── manager side: experience list with levels ──
function vBadge(id, i, level) {
  const L = VLEVEL[level];
  return `<button class="bdg ${L.cls} vbadge" onclick="expInfo('${id}',${i})" aria-label="${L.label}. Tap to see how this was checked"><i class="ti ${L.icon}" style="font-size:11px" aria-hidden="true"></i> ${L.label}</button>`;
}
function expSectionHtml(id, p) {
  const list = exps(id), first = p.name.split(' ')[0];
  const ver = list.filter(e => e.level === 'employer' || e.level === 'document').length;
  const onSL = slShifts(id) ? `<div class="card" style="padding:9px 13px;margin-bottom:7px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><div style="font-size:13px;font-weight:500;color:var(--t1)">On Quarti</div><div style="font-size:12px;color:var(--t2)">${slShifts(id)} shifts completed</div></div>${vBadge(id, -1, 'shiftlink')}</div></div>` : '';
  return `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-2px 0 8px"><span style="font-size:12px;color:var(--t2)">${ver} of ${list.length} past job${list.length === 1 ? '' : 's'} verified</span><button class="linkbtn" onclick="openSheet(levelsSheet())">What do the badges mean?</button></div>` +
    onSL + list.map((e, i) => `<div class="card" style="padding:9px 13px;margin-bottom:7px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div style="min-width:0"><div style="font-size:13px;font-weight:500;color:var(--t1)">${esc(e.role)}</div><div style="font-size:12px;color:var(--t2)">${esc(e.when)}</div></div>${vBadge(id, i, e.level)}</div>
      ${reqHtml(id, i, e, first)}
    </div>`).join('');
}
function reqHtml(id, i, e, first) {
  const r = e.req;
  if (!r) {
    if (e.level !== 'self' && e.level !== 'failed') return '';
    return `<button class="mini-btn" style="margin-top:8px;border-color:var(--br);color:var(--brd);background:var(--brl)" onclick="expAsk('${id}',${i})"><i class="ti ti-shield-check" style="font-size:12px" aria-hidden="true"></i>${e.level === 'failed' ? 'Ask ' + first + ' to try another way' : 'Ask ' + first + ' to verify'}</button>`;
  }
  const biz = bizOf(e);
  const box = (icon, text, actions) => `<div style="margin-top:8px;background:var(--aml);border-radius:8px;padding:8px 9px"><div style="display:flex;gap:7px;font-size:12px;color:var(--amd);line-height:1.45"><i class="ti ${icon}" style="font-size:14px;margin-top:1px;flex-shrink:0" aria-hidden="true"></i><span>${text}</span></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px">${actions}</div></div>`;
  if (r.status === 'asked') return box('ti-clock', `${r.retry ? 'The last document couldn’t be verified. ' : ''}Requested ${r.at}. Waiting for ${first} to ${r.retry ? 'try again' : 'choose how to verify'}.`, proto(`vxOpen('${id}',${i})`, `Open ${first}'s side`) + `<button class="mini-btn" onclick="expCancel('${id}',${i})">Cancel request</button>`);
  if (r.status === 'link_sent') return box('ti-mail', `${first} sent a confirmation link to ${esc(r.contactName)} (${esc(r.contactShow)}). Waiting for ${esc(biz.name)} to answer.`, proto(`elOpen('${id}',${i})`, `Open ${esc(biz.name)}'s link`));
  if (r.status === 'doc_review') return box('ti-file-certificate', `${first} uploaded ${esc(r.doc)}. Quarti is checking the employer name and years, usually within 1–2 days.`, proto(`docResolve('${id}',${i},true)`, 'Simulate: approved') + proto(`docResolve('${id}',${i},false)`, 'Simulate: rejected'));
  return '';
}
function levelsSheet() {
  return `<div style="font-size:15px;font-weight:500;color:var(--t1);margin-bottom:4px">How experience is verified</div>
    <div style="font-size:12px;color:var(--t2);margin-bottom:12px;line-height:1.5">From strongest to weakest. Only the worker can contact a past employer or share documents.</div>
    ${['shiftlink','employer','document','self','failed'].map(l => `<div style="display:flex;gap:10px;padding:8px 0;border-top:0.5px solid var(--b)"><div style="flex-shrink:0;width:132px"><span class="bdg ${VLEVEL[l].cls}" style="font-size:10px"><i class="ti ${VLEVEL[l].icon}" style="font-size:11px" aria-hidden="true"></i> ${VLEVEL[l].label}</span></div><div style="font-size:12px;color:var(--t2);line-height:1.5">${LEVEL_TEXT[l]}</div></div>`).join('')}
    <button class="btn bsec" style="margin-top:12px" onclick="closeSheet()">Close</button>`;
}
function expInfo(id, i) {
  const p = person(id); if (!p) return;
  const first = p.name.split(' ')[0];
  if (i < 0) {
    openSheet(`<div style="margin-bottom:8px">${vBadge(id, -1, 'shiftlink').replace('onclick', 'data-x')}</div>
      <div style="font-size:14px;color:var(--t1);line-height:1.5;margin-bottom:6px">${first} completed ${slShifts(id)} shifts through Quarti.</div>
      <div style="font-size:12px;color:var(--t2);line-height:1.5;margin-bottom:14px">${LEVEL_TEXT.shiftlink} This record follows ${first} to every shop on Quarti.</div>
      <button class="btn bsec" onclick="closeSheet()">Close</button>`);
    return;
  }
  const e = exps(id)[i], L = VLEVEL[e.level];
  const canAsk = !e.req && (e.level === 'self' || e.level === 'failed');
  openSheet(`<div style="margin-bottom:8px"><span class="bdg ${L.cls}" style="font-size:11px"><i class="ti ${L.icon}" style="font-size:12px" aria-hidden="true"></i> ${L.label}</span></div>
    <div style="font-size:14px;font-weight:500;color:var(--t1)">${esc(e.role)}</div>
    <div style="font-size:12px;color:var(--t2);margin-bottom:10px">${esc(e.when)}</div>
    <div style="font-size:12px;color:var(--t2);line-height:1.5;margin-bottom:8px">${LEVEL_TEXT[e.level]}</div>
    ${e.how ? `<div style="background:var(--s1);border-radius:8px;padding:9px 10px;font-size:12px;color:var(--t1);line-height:1.5;margin-bottom:12px">${esc(e.how)}</div>` : ''}
    ${e.req ? `<div style="font-size:12px;color:var(--amd);margin-bottom:12px">A verification request is in progress.</div>` : ''}
    ${canAsk ? `<button class="btn bpri" onclick="expAsk('${id}',${i})">Ask ${first} to verify</button>` : ''}
    ${e.level === 'employer' || e.level === 'document' ? `<button class="btn bsec" onclick="closeSheet();uiToast('Thanks. Quarti will review this badge and may ask for more proof.')"><i class="ti ti-flag" aria-hidden="true"></i> Report a problem with this badge</button>` : ''}
    <button class="btn bsec" onclick="closeSheet()">Close</button>`);
}
function expAsk(id, i) {
  const e = exps(id)[i], first = firstOf(id), biz = bizOf(e);
  openSheet(`<div style="font-size:15px;font-weight:500;color:var(--t1);margin-bottom:4px">Ask ${first} to verify this job?</div>
    <div style="font-size:13px;color:var(--t1);margin-bottom:2px">${esc(e.role)}</div>
    <div style="font-size:12px;color:var(--t2);margin-bottom:12px">${esc(e.when)}</div>
    <div style="font-size:12px;color:var(--t2);line-height:1.55;margin-bottom:14px">${first} gets a request in the app and chooses how: a one-tap confirmation link sent to ${esc(biz.name)}, or a pay stub, T4 / Relevé 1 slip or employment letter. Quarti never contacts a past employer without ${first}'s go-ahead.</div>
    <button class="btn bpri" onclick="expAskSend('${id}',${i})"><i class="ti ti-send" aria-hidden="true"></i> Send request to ${first}</button>
    <button class="btn bsec" onclick="closeSheet()">Not now</button>`);
}
function expAskSend(id, i) {
  const e = exps(id)[i];
  e.req = {status:'asked', at:'Sep 25'};
  closeSheet();
  logEvent(rosterMeta[id] ? id : '', 'ti-shield-check', '#E6F1FB', '#0C447C', 'Asked to verify a job', e.role);
  goTo('Worker profile');
  uiToast(`Request sent. ${firstOf(id)} will be notified.`);
}
function expCancel(id, i) { exps(id)[i].req = null; goTo('Worker profile'); uiToast('Request cancelled.'); }

// ── worker side (preview): choose how to verify ──
function vxOpen(id, i) {
  vx = {wid:id, i, method:'', name:'', contact:'', useListed:false, docType:'Pay stub', doc:'', sin:false, err:'', done:''};
  goTo('Verify experience');
}
function vxSet(f, v) { vx[f] = v; vx.err = ''; vxRender(); }
function vxDocName() {
  const e = exps(vx.wid)[vx.i], biz = bizOf(e).name.replace(/[^A-Za-z]/g, ''), y = yearsOf(e)[1];
  return vx.docType === 'Pay stub' ? `Paystub_${biz}_${y}.pdf` : vx.docType === 'T4 / Relevé 1' ? `Releve1_${y}.pdf` : `Letter_${biz}.pdf`;
}
function vxSendLink() {
  const e = exps(vx.wid)[vx.i], biz = bizOf(e);
  const name = vx.name.trim(), c = vx.contact.trim().toLowerCase();
  if (!name) { vx.err = 'Add the name of the person who can confirm, for example "Marie, kitchen manager".'; vxRender(); return; }
  let show;
  if (vx.useListed) show = `${biz.name}'s listed phone`;
  else {
    const m = c.match(/^[^@\s]+@([^@\s]+\.[a-z]{2,})$/);
    if (!m) { vx.err = 'Enter their work email, or send it to the listed phone instead.'; vxRender(); return; }
    const dom = m[1];
    if (!(dom === biz.domain || dom.endsWith('.' + biz.domain))) {
      vx.err = /(gmail|hotmail|outlook|yahoo|icloud|videotron)\./.test(dom)
        ? `Personal emails can't confirm a job. Use an email at ${biz.domain}, or send it to ${biz.name}'s listed phone.`
        : `That email isn't at ${biz.domain}. To stop fake confirmations, links only go to the business's own email or listed phone.`;
      vxRender(); return;
    }
    show = c;
  }
  e.req = {status:'link_sent', at:'Sep 25', contactName:name, contactShow:show};
  vx.done = 'link'; vxRender();
}
function vxSendDoc() {
  const e = exps(vx.wid)[vx.i];
  if (!vx.doc) { vx.err = 'Choose the file first.'; vxRender(); return; }
  if (!vx.sin) { vx.err = 'Please confirm your SIN is covered before sending.'; vxRender(); return; }
  e.req = {status:'doc_review', at:'Sep 25', doc:vx.doc};
  vx.done = 'doc'; vxRender();
}
function vxRender() {
  const b = document.getElementById('vx-body'); if (!b) return;
  if (!vx) vx = {wid:'kb', i:1, method:'', name:'', contact:'', useListed:false, docType:'Pay stub', doc:'', sin:false, err:'', done:''};
  const p = person(vx.wid), e = p && exps(vx.wid)[vx.i];
  if (!e) { b.innerHTML = '<div style="padding:24px 0;text-align:center;color:var(--t3);font-size:13px">Nothing to verify here.</div>'; return; }
  const first = p.name.split(' ')[0], biz = bizOf(e);
  const banner = `<div class="proto-banner"><i class="ti ti-device-mobile" style="font-size:16px;flex-shrink:0" aria-hidden="true"></i><span><b>Worker app preview.</b> This is what ${first} sees on their phone. The worker app isn't built yet.</span></div>`;
  const job = `<div class="card" style="padding:10px 12px;margin-bottom:12px;background:var(--s1)"><div style="font-size:11px;color:var(--t3);margin-bottom:3px">${e.req && e.req.status === 'asked' ? esc(SHOP.name) + ' asked you to verify this job' : 'Verify a job on your profile'}</div><div style="font-size:14px;font-weight:500;color:var(--t1)">${esc(e.role)}</div><div style="font-size:12px;color:var(--t2)">${esc(e.when)}</div></div>`;
  const back = proto(`goTo('Worker profile')`, 'Back to manager view');
  if (vx.done === 'link') {
    b.innerHTML = banner + job + `<div style="text-align:center;padding:10px 4px 16px"><div style="width:44px;height:44px;border-radius:50%;background:var(--brl);color:var(--br);display:inline-flex;align-items:center;justify-content:center;margin-bottom:8px"><i class="ti ti-mail" style="font-size:22px" aria-hidden="true"></i></div>
      <div style="font-size:15px;font-weight:500;color:var(--t1);margin-bottom:4px">Link sent to ${esc(e.req.contactName)}</div>
      <div style="font-size:12px;color:var(--t2);line-height:1.5">Sent to ${esc(e.req.contactShow)}. You'll get a notification when ${esc(biz.name)} answers. ${esc(SHOP.name)} can see it's on its way.</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">${proto(`elOpen('${vx.wid}',${vx.i})`, `Open ${esc(biz.name)}'s link`)}${back}</div>`;
    return;
  }
  if (vx.done === 'doc') {
    b.innerHTML = banner + job + `<div style="text-align:center;padding:10px 4px 16px"><div style="width:44px;height:44px;border-radius:50%;background:var(--pul);color:var(--pu);display:inline-flex;align-items:center;justify-content:center;margin-bottom:8px"><i class="ti ti-file-certificate" style="font-size:22px" aria-hidden="true"></i></div>
      <div style="font-size:15px;font-weight:500;color:var(--t1);margin-bottom:4px">Sent for review</div>
      <div style="font-size:12px;color:var(--t2);line-height:1.5">Quarti checks the employer name and years, usually within 1–2 days, then deletes ${esc(e.req.doc)}.</div></div>
      <div style="display:flex;justify-content:center">${back}</div>`;
    return;
  }
  const opt = (m, icon, t, s) => `<button class="mopt${vx.method === m ? ' on' : ''}" onclick="vxSet('method','${m}')" aria-pressed="${vx.method === m}"><i class="ti ${icon}" style="font-size:17px;color:${vx.method === m ? 'var(--brd)' : 'var(--t2)'}" aria-hidden="true"></i><div style="font-size:13px;font-weight:500;color:var(--t1);margin-top:5px">${t}</div><div style="font-size:11px;color:var(--t3);margin-top:2px;line-height:1.4">${s}</div></button>`;
  let form = '';
  if (vx.method === 'employer') {
    form = `<div style="display:flex;gap:9px;align-items:flex-start;background:var(--s1);border:0.5px solid var(--b);border-radius:10px;padding:9px 11px;margin-bottom:12px"><i class="ti ti-building-store" style="font-size:16px;color:var(--t2);margin-top:1px" aria-hidden="true"></i><div style="font-size:12px;color:var(--t2);line-height:1.5"><b style="color:var(--t1)">${esc(biz.name)}</b> · ${esc(biz.area)}<br>Business website: ${biz.domain}</div></div>
      ${biz.franchise ? `<div style="font-size:12px;color:var(--amd);background:var(--aml);border-radius:8px;padding:8px 10px;margin-bottom:12px;line-height:1.5">${esc(biz.name)} stores are run by separate owners. Send it to the owner or manager of the store you worked at, not head office.</div>` : ''}
      <div class="inpl">Who can confirm you worked there?</div>
      <input id="vx-name" class="inpf" placeholder="e.g. Marie, kitchen manager" value="${esc(vx.name)}" oninput="vx.name=this.value">
      <div class="inpl">Their work email</div>
      <input id="vx-contact" class="inpf" type="email" placeholder="name@${biz.domain}" value="${esc(vx.contact)}" ${vx.useListed ? 'disabled style="opacity:.5"' : ''} oninput="vx.contact=this.value">
      <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t1);margin:-2px 0 10px;cursor:pointer"><input type="checkbox" ${vx.useListed ? 'checked' : ''} onchange="vxSet('useListed',this.checked)"> Send it to ${esc(biz.name)}'s listed phone instead</label>
      <div style="font-size:11px;color:var(--t3);line-height:1.5;margin-bottom:12px">To stop fake confirmations, links only go to an email at ${biz.domain} or to the phone number listed for ${esc(biz.name)}. Personal emails like Gmail can't confirm a job.</div>
      ${vx.err ? `<div style="font-size:12px;color:var(--rd);margin-bottom:8px">${vx.err}</div>` : ''}
      <button class="btn bpri" onclick="vxSendLink()"><i class="ti ti-send" aria-hidden="true"></i> Send confirmation link</button>`;
  } else if (vx.method === 'document') {
    form = `<div class="inpl">Type of document</div>
      <div style="margin-bottom:12px">${['Pay stub','T4 / Relevé 1','Employment letter'].map(t => `<span class="chip${vx.docType === t ? ' on' : ''}" onclick="vx.docType='${t}';vx.doc='';vxRender()">${t}</span>`).join('')}</div>
      ${vx.doc ? `<div style="display:flex;align-items:center;gap:9px;border:0.5px solid var(--bs);border-radius:10px;padding:9px 11px;margin-bottom:12px"><i class="ti ti-paperclip" style="font-size:16px;color:var(--t2)" aria-hidden="true"></i><span style="flex:1;font-size:13px;color:var(--t1)">${esc(vx.doc)}</span><button onclick="vxSet('doc','')" aria-label="Remove file" style="background:none;border:none;cursor:pointer;color:var(--t3)"><i class="ti ti-x" style="font-size:15px" aria-hidden="true"></i></button></div>`
        : `<button class="btn bsec" style="margin-bottom:12px" onclick="vxSet('doc',vxDocName())"><i class="ti ti-file-upload" aria-hidden="true"></i> Choose file</button>`}
      <div style="display:flex;gap:8px;background:var(--aml);color:var(--amd);border-radius:8px;padding:9px 10px;font-size:12px;line-height:1.5;margin-bottom:10px"><i class="ti ti-alert-triangle" style="font-size:15px;flex-shrink:0;margin-top:1px" aria-hidden="true"></i><span>Cover your Social Insurance Number (SIN) before uploading. Quarti only checks the employer name and years, then deletes the file.</span></div>
      <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t1);margin-bottom:12px;cursor:pointer"><input type="checkbox" ${vx.sin ? 'checked' : ''} onchange="vx.sin=this.checked;vx.err=''"> My SIN is covered or removed</label>
      ${vx.err ? `<div style="font-size:12px;color:var(--rd);margin-bottom:8px">${vx.err}</div>` : ''}
      <button class="btn bpri" onclick="vxSendDoc()">Send for review</button>`;
  }
  b.innerHTML = banner + job +
    `<div style="font-size:13px;font-weight:500;color:var(--t1);margin-bottom:8px">How do you want to verify it?</div>
    <div style="display:flex;gap:7px;margin-bottom:14px">${opt('employer', 'ti-building-store', 'Ask my former employer', 'Fastest. They tap one button, no account needed.')}${opt('document', 'ti-file-certificate', 'Upload a document', 'Pay stub, T4 / Relevé 1 or employment letter.')}</div>
    ${form || '<div style="font-size:12px;color:var(--t3);line-height:1.5">Verified jobs show a badge on your profile, so managers trust your experience and hire you faster.</div>'}`;
}

// ── employer side (preview): the page opened from the link ──
function elOpen(id, i) {
  const e = exps(id)[i], [from, to] = yearsOf(e);
  el = {wid:id, i, step:'ask', role:e.role.split(' · ')[0], from, to, err:''};
  goTo('Employer link');
}
function elStep(s) { el.step = s; el.err = ''; elRender(); }
function elResolve(kind) {
  const e = exps(el.wid)[el.i], biz = bizOf(e), first = firstOf(el.wid);
  if (!e.req) { el.step = 'gone'; elRender(); return; }   // the request ended (cancelled, removed or declined): the answer is ignored
  const r = (e.req && e.req.contactName) ? e.req : {contactName:'The manager', contactShow:`${biz.name}'s listed phone`};
  if (kind === 'differ') {
    const role = (document.getElementById('el-role') || {value:el.role}).value.trim();

function rcOccurrences(d) {

    let why = '';

    else if (isInactive(d.wid)) why = 'Worker is inactive';
    else if (!t) why = 'That period no longer exists';
    else {
      const recs = viewShifts(k).filter(r => r.pos === d.pos && r.period === d.period);
      if (recs.some(r => r.wid === d.wid)) why = 'Already booked';
      else if (!recs.length) why = `No ${d.pos.toLowerCase()} needed this period`;
      else if ((why = whyNot(d.wid, k, toH(t.s), pe(t)))) { /* reason set */ }
      else if (!recs.some(r => !r.wid)) why = 'Slot already full';

// ── answering ──
function wOfferAccept(key) {
  const o = pendingOffers[key]; if (!o) { wGo(null, 'Sorry, this shift was already taken.'); return; }
  const x = o.recipients.find(y => y.id === ME);
  wRun(() => offerAccept(key, ME));
  const r = x && x.slot && getShift(x.slot);
  if (x && x.status === 'accepted' && r && r.wid === ME) wGo(null, `It's yours: ${r.pos} ${dLabel(r.date)} ${hh(r.s)}–${hh(r.e)}. It's in My shifts.`);
  else if (x && x.status === 'withdrawn') wGo(null, `You can't take this one: ${lc1(x.why || 'no longer free')}.`);
  else wGo(null, 'Sorry, this shift was already taken.');
}
function wOfferDecline(key) {
  const o = pendingOffers[key]; if (!o) { wGo(); return; }
  wRun(() => offerDecline(key, ME)); wGo(null, "Declined. The manager was told.");
}
function wReply(id, ok) {
  const r = getShift(id); if (!r || r.wid !== ME || r.confirm !== 'pending') { wGo(); return; }
  const series = !!r.recurring;
  if (!ok) { uiConfirm(`Decline ${series ? 'the whole recurring series' : `the ${esc(r.pos.toLowerCase())} shift on ${dLabel(r.date)}`}? It goes back to the manager to fill.`, 'Decline', () => { wRun(() => reply(id, false)); wGo(null, 'Declined. The manager was told.'); }, true); return; }
  wRun(() => reply(id, true)); wGo(null, series ? 'Accepted. The whole series is in My shifts.' : 'Accepted. See you there!');
}
function wSwapAnswer(id, ok) {
  swapSync();
  const x = SWAPS.find(y => y.id === id); if (!x || x.status !== 'asked' || x.to !== ME) { wGo(null, 'This swap request has ended.'); return; }
  if (!ok) { x.status = 'refused'; logEvent(x.from, 'ti-x', '#FCEBEB', '#791F1F', 'Swap refused', `${firstOf(ME)} said no to trading ${swapWhen(getShift(x.sid))}`); wGo(null, 'OK. You keep your shift.'); return; }
  const why = canTake(ME, getShift(x.sid), [x.withSid]) || canTake(x.from, getShift(x.withSid), [x.sid]);
  if (why) { x.status = 'expired'; x.why = why; logEvent(x.from, 'ti-arrows-exchange', '#F1EFE8', '#5F5E5A', 'Swap request ended', why); wGo(null, `This trade can't happen anymore: ${lc1(why)}.`); return; }
  x.status = 'agreed';
  logEvent(x.from, 'ti-arrows-exchange', '#E6F1FB', '#0C447C', 'Swap agreed', `${firstOf(ME)} agreed. Waiting for the manager.`);
  wGo(null, 'Agreed. The manager will approve or decline it.');
}

function wTradeOptions(X) {   // coworkers' confirmed shifts I could take, who could take mine

  SWAPS.unshift({id:'sw' + (++swSeq), kind:'trade', sid, from:ME, to:Y.wid, withSid:ysid, status:'asked', takenBy:'', why:'', at:TODAY});
  logEvent(Y.wid, 'ti-arrows-exchange', '#E6F1FB', '#0C447C', 'Swap request', `${firstOf(ME)} asks to trade ${swapWhen(X)} for your ${swapWhen(Y)}`);

// v21 — CLAIMS WAIT FOR THE MANAGER · WORKER CALENDAR · MORE THAN ONE JOB
// ════════════════════════════════════════════════════════════════

// ── claims: workers ask for an open shift; the manager picks who gets it (Shop setting, on by default) ──
if (SHOP.claimApprove === undefined) SHOP.claimApprove = true;
let CLAIMS = [], clSeq = 0;       // {id, sid, wid, status:'waiting'|'approved'|'declined'|'withdrawn'|'expired', cover, why, n}
function claimsFor(sid) { return CLAIMS.filter(c => c.sid === sid && c.status === 'waiting').sort((a, b) => a.n - b.n); }
function claimHint() { return SHOP.claimApprove ? 'Your staff can ask for it in the app. You choose who gets it.' : 'Your staff can claim it in the app. First to claim gets it.'; }
function claimBlock(r, wid) {     // why wid can't claim r right now, or ''
  if (SHOP.claim !== 'workers') return 'Claiming is turned off';
  if (!fillable(r)) return r && live(r) && r.wid ? 'Someone already has this shift' : 'This shift is no longer open';
  if (!rosterMeta[wid] || isInactive(wid)) return 'Not active at this shop';
  const w = calWorker(wid), cover = !qualifies(w, r.pos);
  if (cover && !SHOP.claimOther) return `Only workers who hold the ${r.pos} position can claim it`;
  if (cover && coverWhy(wid, r.pos)) return coverWhy(wid, r.pos);
  const s0 = Math.max(r.s, minStart(r.date));
  if (r.e - s0 < 0.5) return 'This shift is nearly over';
  return whyNot(wid, r.date, s0, r.e, r.id);
}
function claimRequest(id, wid) {
  if (!SHOP.claimApprove) return claimShift(id, wid);
  const r = getShift(realize(id)), why = claimBlock(r, wid);
  if (why) { goTo(active); uiToast(`${firstOf(wid)} can't ask for it: ${lc1(why)}.`); return; }
  if (claimsFor(r.id).some(c => c.wid === wid)) { goTo(active); uiToast(`${firstOf(wid)} already asked for this shift.`); return; }
  CLAIMS.push({id:'cl' + (++clSeq), sid:r.id, wid, status:'waiting', cover:!qualifies(calWorker(wid), r.pos), why:'', n:clSeq});
  logEvent(wid, 'ti-hand-finger', '#FAEEDA', '#633806', 'Asked for an open shift', `${dLabel(r.date)} · ${r.pos} ${hh(r.s)}–${hh(r.e)} · waiting for the manager`);
  goTo(active);
  uiToast(`${firstOf(wid)} asked for the ${r.pos.toLowerCase()} shift. Approve it from Actions or the slot.`);
}
function claimSync() {
  CLAIMS.forEach(c => {
    if (c.status !== 'waiting') return;
    const r = getShift(c.sid);
    let why = !r || !live(r) ? 'The shift was removed' : r.wid ? 'The shift was filled another way' : ended(r) ? 'The shift is over' : claimBlock(r, c.wid);
    if (!why) return;
    c.status = 'expired'; c.why = why;
    if (rosterMeta[c.wid]) logEvent(c.wid, 'ti-hand-off', '#F1EFE8', '#5F5E5A', 'Shift request ended', `${r ? dLabel(r.date) + ' · ' + r.pos + ' · ' : ''}${why}`);

// v24 — WHAT A WORKER CAN DO WITH A SHIFT
// Give away or swap (v20), call out, running late, ask to drop, ask to change times.
// A call-out and a late notice tell the manager; dropping and new times need the manager's OK.
// ════════════════════════════════════════════════════════════════
let SREQS = [], srSeq = 0;       // {id, kind:'drop'|'times', sid, wid, s, e, note, status:'waiting'|'approved'|'declined'|'withdrawn'|'expired', why, at}

function lateOk(r) { return myShiftOk(r) && r.date === TODAY && NOW_H >= r.s - 3 && NOW_H < r.e; }

// a waiting request whose shift changed hands, ended or started can no longer go ahead
function srSync() {
  SREQS.forEach(x => {
    if (x.status !== 'waiting') return;
    const r = getShift(x.sid);
    const why = !live(r) || r.wid !== x.wid ? 'The shift changed' : started(r) ? 'The shift has started' : '';
    if (!why) return;
    x.status = 'expired'; x.why = why;
    if (rosterMeta[x.wid]) logEvent(x.wid, 'ti-clock-off', '#F1EFE8', '#5F5E5A', x.kind === 'drop' ? 'Drop request ended' : 'Time change request ended', why);
  });
  CALLOUTS.forEach(c => { const r = getShift(c.sid); if (!c.done && (!live(r) || r.wid || ended(r))) c.done = true; });
}

// ── the options sheet ──
function wShiftMenu(sid) {

  else if (rq) body = `<div class="w-ban" style="margin-bottom:10px"><i class="ti ti-hourglass" aria-hidden="true"></i><div>You asked to ${rq.kind === 'drop' ? 'drop this shift' : `work ${timesLabel(rq.s, rq.e)} instead`}. Waiting for the manager. You're still on the shift until then.</div></div>
      <button class="btn bsec" style="margin-bottom:8px" onclick="wSrWithdraw('${rq.id}')">Withdraw the request</button>`;
  else if (sw) body = `<div class="w-ban" style="margin-bottom:10px"><i class="ti ti-arrows-exchange" aria-hidden="true"></i><div>${sw.from === ME ? 'You asked to give away or swap this shift.' : 'A coworker asked to trade for this shift.'} Other changes wait until that ends.</div></div>`;

    if (!st && !busy) body += opt('ti-arrows-exchange', 'Give away or swap', 'A coworker takes it or trades with you. The manager approves.', `closeSheet();wSwapOpen('${r.id}')`, r.virtual || !swapShiftOk(r, ME));

    <div style="font-size:12px;color:var(--t2);margin-bottom:12px">${timesLabel(r.s, r.e)}${r.late ? ` · you said around ${hh(r.late.eta)}` : ''}</div>
    ${body}
    <div class="slbl" style="margin-top:6px">Working with you</div>
    <div style="font-size:12px;color:var(--t1);margin-bottom:10px;line-height:1.6">${crew.length ? crew.map(x => `${esc(firstOf(x.wid))} <span style="color:var(--t3)">· ${esc(x.pos.toLowerCase())} ${timesLabel(x.s, x.e)}</span>`).join('<br>') : '<span style="color:var(--t3)">Nobody else is booked during your shift yet.</span>'}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
      <a class="mini-btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(SHOP.address || SHOP.name)}" target="_blank" rel="noopener"><i class="ti ti-map-pin" aria-hidden="true"></i> Directions</a>
      <button class="mini-btn" onclick="wAskAbout('${r.id}')"><i class="ti ti-message" aria-hidden="true"></i> Message the manager</button></div>

function callOut(r, why, note) {

// ═════ Copying schedules: one engine for "Copy to…", "Repeat this day…", "Repeat this week…", "Copy to rest of week" ═════
// A plan is a list of [source day, target day] pairs. Targets are tomorrow or later. If some targets already have
// shifts, the manager picks what happens on those days:
//   skip  – leave them alone (the old behaviour)
//   empty – fill only the empty spots: per position and period, one that already has someone (or an offer out) stays as it is
//   add   – add the copied workers to what's there, up to the usual staffing for that period (Period setup); nobody is removed
const CP_MAX_WEEKS = 8;
let cpCtx = null;
function cpHas(t) { return isPlanned(t) && dayShifts(t).some(r => (r.wid && !r.recurring) || pendingOffers[r.id]); }
function cpSrc(k) { if (k < TODAY && typeof ensurePast === 'function') ensurePast(k); return dayShifts(k); }
function cpHasWorkers(k) { return cpSrc(k).some(r => r.wid); }
function cpMonday(k) { return addDays(k, -((new Date(k + 'T12:00:00').getDay() + 6) % 7)); }
function cpUsual(pos, period) { const t = PERIODS.find(p => p.name === period); const q = t && t.positions.find(x => x.name === pos); return q ? q.n : 0; }
const cpRank = r => r.wid && !r.recurring ? 0 : !r.wid ? 1 : 2;
function cpGroups(src) {
  const g = {};
  src.forEach(r => { (g[r.pos + '|' + r.period] = g[r.pos + '|' + r.period] || []).push(r); });
  Object.values(g).forEach(l => l.sort((a, b) => cpRank(a) - cpRank(b)));
  return g;
}
function cpPeriodOk(r) { return r.period === 'Outside periods' || PERIODS.some(p => p.name === r.period); }
// put the copied worker on slot c if they can work it; otherwise leave it open and say why
function cpPut(r, c, t, st) {
  const why = whyNot(r.wid, t, c.s, c.e, c.id) || (qualifies(calWorker(r.wid), r.pos) ? '' : coverWhy(r.wid, r.pos));
  if (why) { st.leftOpen++; st.reasons.add(`${firstOf(r.wid)}: ${lc1(why)}`); return false; }
  c.wid = r.wid; c.rate = rateFor(r.wid, r.pos); c.confirm = 'draft'; c.declinedBy = ''; c.cover = !qualifies(calWorker(r.wid), r.pos);
  return true;
}
function cpCopyList(list, t, st) {
  list.forEach(r => { const c = mkShift({date:t, pos:r.pos, s:r.s, e:r.e, extra:r.extra, reason:r.reason}); if (r.wid && !r.recurring && !isSelf(r.wid)) cpPut(r, c, t, st); });   // a shift you covered yourself is copied open
}
// a day with nothing set up by hand: re-plan it as a copy of the source (series bookings stay)
function cpFresh(src, t, st) {
  planDay(t);
  dayShifts(t).filter(r => !r.recurring || !r.wid).forEach(r => removeShift(r.id, 'Day re-planned'));
  const keep = dayShifts(t);
  Object.entries(cpGroups(src)).forEach(([key, list]) => {
    if (!cpPeriodOk(list[0])) { st.noPeriod.add(list[0].period); return; }
    const have = keep.filter(x => x.pos + '|' + x.period === key).length;   // series bookings already fill some of these
    cpCopyList(list.slice(0, Math.max(0, list.length - have)), t, st);
  });
}
function cpEmpty(src, t, st) {
  Object.entries(cpGroups(src)).forEach(([key, list]) => {
    if (!cpPeriodOk(list[0])) { st.noPeriod.add(list[0].period); return; }
    const tg = dayShifts(t).filter(x => x.pos + '|' + x.period === key);
    if (tg.some(x => x.wid || pendingOffers[x.id])) { st.kept++; return; }
    tg.forEach(x => removeShift(x.id, 'Day re-planned'));                    // only open slots with no offer out

}
function cpAdd(src, t, st) {
  Object.entries(cpGroups(src)).forEach(([key, list]) => {
    const r0 = list[0]; if (!cpPeriodOk(r0)) { st.noPeriod.add(r0.period); return; }
    const max = cpUsual(r0.pos, r0.period);

  if (!tipCheck()) wGo('Me', yes ? 'Accepted.' : "OK. It won't start without you.");
}
function tipCheck() {
  const p = TIPPROP; if (!p) return false;
  const pm = tipMembers(p.weights); if (!pm.length || !pm.every(w => p.ok[w.id])) return false;
  const since = addDays(TODAY, 1);                     // from tomorrow, so today's split doesn't change under anyone
  TIPRULES = TIPRULES.filter(x => x.since < since).concat([{weights:p.weights, since}]);
  pm.forEach(w => logEvent(w.id, 'ti-coin', '#E1F5EE', '#085041', 'New tip sharing agreed', `${Object.entries(p.weights).filter(([, v]) => v > 0).map(([k, v]) => k + ' ×' + v).join(' · ')} · from ${rcShort(since)}`));
  TIPPROP = null;
  if (ROLE === 'worker') wGo('Me', `Everyone accepted. It starts ${rcShort(since)}.`);
  return true;
}
function tipWithdraw() { if (TIPPROP && TIPPROP.by === ME) { TIPPROP = null; wGo('Me', 'Withdrawn.'); } }
function tipSimAll() { const p = TIPPROP; if (!p) return; tipMembers(p.weights).forEach(w => { p.ok[w.id] = true; }); tipCheck(); }
function wTipsCardHtml() {
  const [pa, pb] = payPeriod(TODAY), c = tipsFor(ME, pa, pb); if (!c) return '';
  const y = addDays(TODAY, -1), s = tipShares(y), x = s && s.list.find(z => z.wid === ME);
  return `<div class="card w-tip"><i class="ti ti-coin" aria-hidden="true"></i><span><b>${money(c)} in tips this pay period</b><small>${x ? `Yesterday ${money(x.c)} · ${+x.h.toFixed(2)} h` : rangeLabel(pa, pb)}</small></span></div>`;
}

// ═════ One access check for every manager tap ═════
// Screens stay on the phone after access ends (a stand-in's date passes, the plan is cancelled, someone else
// removes you). A tap on that stale screen must not act. In the real app the server refuses the request;
// here, one capture-phase listener plays that part for every button, field and sheet inside the phone.
function mgrStale() { return ROLE === 'manager' && active !== 'No access' && !hasAccess(MGR_ME); }
(function () {
  const stop = e => {
    const t = e.target; if (!t || !t.closest || !t.closest('#stage')) return;     // the demo's "whose app" switcher sits outside
    if (e.type === 'keydown' && e.key !== 'Enter') return;
    if (!mgrStale()) return;
    e.stopImmediatePropagation(); e.preventDefault();
    if (e.type === 'click' || e.type === 'keydown' || e.type === 'submit') mgrBounce();
  };
  ['click', 'change', 'submit', 'keydown'].forEach(t => window.addEventListener(t, stop, true));
})();

let __leaving = false;
const LEAVE_GUARD = {
  'Fill slot':       {dirty:() => Object.keys(fsSendMap).length > 0, kids:['Worker profile'], msg:"You picked workers but didn't send the offer.", discard:() => { fsSendMap = {}; }},
  'New hiring post': {dirty:() => hpDirty(), kids:[], msg:"This hiring post isn't published yet.", discard:() => { hpDraft = null; }},
  'Recurring shift': {dirty:() => rcDirty(), kids:['Worker profile'], msg:"The recurring shift you were setting up isn't created yet.", discard:() => { rcDraft = null; }},
  'Shop setup':      {dirty:() => shopDirty(), kids:['Period setup','Positions','Position editor','Leave rules','Plan & access'], msg:"You changed the shop details but didn't save them.", discard:() => { shDraft = null; }},
  'Period setup':    {dirty:() => psDirty(), kids:[], msg:"Your period changes aren't saved yet.", discard:() => { psFromPeriods(); psErr = ''; }},
  'Position editor': {dirty:() => peDirty(), kids:[], msg:"Your changes to this position aren't saved yet.", discard:() => { peDraft = null; }},
  'Leave rules':     {dirty:() => lrDirty(), kids:[], msg:"Your leave rules aren't saved yet.", discard:() => { lrDraft = null; lrNew = LR_EMPTY(); }},
};
const SHOP_FAMILY = ['Shop setup','Period setup','Positions','Position editor','Leave rules','Plan & access'];
SCREENS.push('Plan & access', 'Tips');
function goTo(screen) {
  if (ROLE === 'worker' && !W_SCREENS.includes(screen)) screen = W_SCREENS.includes(active) ? active : 'My home';   // the worker app never shows a manager screen
  else if (ROLE === 'owner') screen = 'Owner home';
  else if (ROLE === 'manager' && !hasAccess(MGR_ME)) { if (MGR_ME !== 'nadia') { mgrBounce(); return; } screen = 'No access'; }
  else if (ROLE === 'manager' && (W_SCREENS.includes(screen) || O_SCREENS.includes(screen) || screen === 'No access')) screen = 'Dashboard';
  syncOffers(); swapSync(); claimSync(); srSync();                                   // keep offers honest even when leaving is paused by an unsaved-changes question
  const prev = active, g = LEAVE_GUARD[prev];
  if (screen !== prev && !__leaving) {
    const hits = [];
    if (g && prev !== 'Shop setup' && !g.kids.includes(screen) && g.dirty()) hits.push(g);
    if (SHOP_FAMILY.includes(prev) && !SHOP_FAMILY.includes(screen) && shopDirty()) hits.push(LEAVE_GUARD['Shop setup']);   // unsaved shop details, even from a sub-screen

      uiConfirm(hits.map(x => esc(x.msg)).join(' ') + ' Leave without saving?', 'Discard changes', () => { hits.forEach(x => x.discard()); __leaving = true; try { goTo(screen); } finally { __leaving = false; } }, true);

    if (screen === 'Vacation requests' && prev !== 'Leave rules') lpPick = null;
    if (screen === 'Offer status' && ['Dashboard','Actions','Calendar','Shift detail'].includes(prev)) offerBack = prev;
    if (screen === 'Offer status' && prev === 'Fill slot' && fillBack !== 'Offer status') offerBack = fillBack;

    if (screen === 'Shop setup' && !LEAVE_GUARD['Shop setup'].kids.includes(prev)) shDraft = null;
    if (screen === 'Period setup') { psFromPeriods(); psErr = ''; }

  buildTabs();
  const fn = S[screen];

}
